<!DOCTYPE html>
<html>
<head>
    <title>Test Destinations</title>
</head>
<body>

<h1>Destinations Test Page</h1>

<p>Total destinations: {{ destinations|length }}</p>

<ul>
    {% for destination in destinations %}
        <li>{{ destination.name }}</li>
    {% empty %}
        <li>NO DESTINATIONS FOUND</li>
    {% endfor %}
</ul>

</body>
</html>
